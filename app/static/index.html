<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harvester Control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand"><span class="logo" aria-hidden="true"></span>Harvester Control</div>
      <p class="muted">SUSE Virtualization on AWS</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error-text" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true"></span>Harvester Control</div>
      <span id="summary" class="pill">…</span>
      <div class="top-meta">
        <span id="updated" class="muted"></span>
        <button id="refresh" class="btn ghost small" type="button">Refresh</button>
        <button id="logout" class="btn ghost small" type="button">Sign out</button>
      </div>
    </header>

    <main>
      <section class="card power">
        <div>
          <h2>Power</h2>
          <p id="power-hint" class="muted"></p>
        </div>
        <div class="btns">
          <button id="btn-start" class="btn primary" type="button" disabled>Start</button>
          <button id="btn-recover" class="btn" type="button" disabled>Recover KVM nodes</button>
          <button id="btn-stop" class="btn danger" type="button" disabled>Stop</button>
        </div>
      </section>

      <section class="grid">
        <div class="card"><h3>EC2 host</h3><div id="host"><p class="empty">Loading…</p></div></div>
        <div class="card"><h3>Harvester</h3><div id="harvester"><p class="empty">Loading…</p></div></div>
        <div class="card"><h3>KVM node instances</h3><div id="kvm"><p class="empty">Loading…</p></div></div>
      </section>

      <section class="card"><h3>Harvester nodes</h3><div id="nodes"><p class="empty">Loading…</p></div></section>
      <section class="card"><h3>Virtual machines</h3><div id="vms"><p class="empty">Loading…</p></div></section>
      <section class="card"><h3>Activity</h3><div id="job"><p class="empty">Loading…</p></div></section>
    </main>
  </div>

  <dialog id="confirm">
    <form method="dialog">
      <h3 id="c-title"></h3>
      <div id="c-body"></div>
      <label id="c-force-wrap" class="force" hidden>
        <input id="c-force" type="checkbox">
        <span>Force: carry on if SSH or the Harvester API is unreachable or a step times out. Running VMs may be cut off.</span>
      </label>
      <div class="dlg-btns">
        <button class="btn ghost" value="cancel" type="submit">Cancel</button>
        <button id="c-ok" class="btn" value="ok" type="submit">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
