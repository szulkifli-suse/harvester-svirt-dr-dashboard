{{- $name := include "hd.fullname" . -}}
{{- $existing := get ((lookup "v1" "Secret" .Release.Namespace $name) | default dict) "data" | default dict -}}
{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hd.labels" . | nindent 4 }}
type: Opaque
data:
  dashboard-password: {{ include "hd.secretValue" (dict "name" "dashboardPassword" "value" $s.dashboardPassword "existing" (get $existing "dashboard-password") "generate" true) }}
  aws-access-key-id: {{ include "hd.secretValue" (dict "name" "awsAccessKeyId" "value" $s.awsAccessKeyId "existing" (get $existing "aws-access-key-id")) }}
  aws-secret-access-key: {{ include "hd.secretValue" (dict "name" "awsSecretAccessKey" "value" $s.awsSecretAccessKey "existing" (get $existing "aws-secret-access-key")) }}
  ssh-private-key: {{ include "hd.secretValue" (dict "name" "sshPrivateKey" "value" $s.sshPrivateKey "existing" (get $existing "ssh-private-key")) }}
  harvester-kubeconfig: {{ include "hd.secretValue" (dict "name" "harvesterKubeconfig" "value" $s.harvesterKubeconfig "existing" (get $existing "harvester-kubeconfig")) }}
